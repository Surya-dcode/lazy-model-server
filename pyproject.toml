[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazy-model-server"
version = "0.1.0"
description = "A model server that loads models on first use and unloads them to stay inside a memory budget."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Surya Doddipatla" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pyyaml>=6",
    "psutil>=5.9",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
torch = ["torch>=2.1"]
dev = ["pytest>=7", "ruff>=0.4", "httpx>=0.25"]

[project.scripts]
lazyserve = "lazyserve.cli:main"

[project.urls]
Repository = "https://github.com/Surya-dcode/lazy-model-server"

[tool.hatch.build.targets.wheel]
packages = ["src/lazyserve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Newer Starlette prefers the httpx2 package for TestClient; httpx still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
